logging.config=${SAMAAJ_SEVA_LOGGING_CONFIG:classpath:logback/logback-dev.xml}
logging.level.com.frontrow.samaajseva=${SAMAAJ_SEVA_LOGGING_LEVEL:INFO}
logging.level.org.apache.kafka=${SAMAAJ_SEVA_KAFKA_LOGGING_LEVEL:WARN}
spring.main.banner-mode=LOG
log.home=${SAMAAJ_SEVA_LOG_HOME:/var/log}
sentry.level=${SAMAAJ_SEVA_SENTRY_LEVEL:ERROR}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
spring.jpa.show-sql=false
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_history
spring.jpa.open-in-view=${SAMAAJ_SEVA_SPRING_JPA_OSIV:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ----------------------------------
# ---- Liquibase config  ----
# ----------------------------------
spring.liquibase.enabled=${SAMAAJ_SEVA_LIQUIBASE_ENABLED:true}
spring.liquibase.change-log=classpath:db/changelog-master.xml
spring.liquibase.drop-first=false
spring.liquibase.database-change-log-table=database_change_log
spring.liquibase.database-change-log-lock-table=database_change_log_lock
logging.level.liquibase=${SAMAAJ_SEVA_LIQUIBASE_LOGGING_LEVEL:ERROR}

# ----------------------------------
# ---- Tomcat container config  ----
# ----------------------------------
server.tomcat.accept-count=${SAMAAJ_SEVA_TOMCAT_ACCEPT_COUNT:500}
server.tomcat.max-connections=${SAMAAJ_SEVA_TOMCAT_MAX_CONNECTIONS:10000}
server.tomcat.threads.max=${SAMAAJ_SEVA_TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=${SAMAAJ_SEVA_TOMCAT_MIN_SPARE_THREADS:80}

# ----------------------------------
# ---- Redis config  ----
# ----------------------------------
redis.host=${SAMAAJ_SEVA_SPRING_REDIS_HOST:localhost}
redis.port=${SAMAAJ_SEVA_SPRING_REDIS_PORT:6379}
redis.password=${SAMAAJ_SEVA_SPRING_REDIS_PASSWORD:}
redis.useSsl=${SAMAAJ_SEVA_SPRING_REDIS_USE_SSL:false}
redis.cluster=${SAMAAJ_SEVA_SPRING_REDIS_CLUSTER:central-redis-staging.8r3vtk.clustercfg.aps1.cache.amazonaws.com:6379}
redis.clusterPassword=${SAMAAJ_SEVA_SPRING_REDIS_CLUSTER_PASSWORD:}
redis.clusterSsl=${SAMAAJ_SEVA_SPRING_REDIS_CLUSTER_SSL:false}
redis.clusterMode=${SAMAAJ_SEVA_SPRING_REDIS_CLUSTER_MODE:false}
redis.retryAttempts=${SAMAAJ_SEVA_SPRING_REDIS_RETRY_ATTEMPTS:5}
redis.retryInterval=${SAMAAJ_SEVA_SPRING_REDIS_RETRY_INTERVAL:3000}
redis.cache.topic=${SAMAAJ_SEVA_SPRING_REDIS_CACHE_TOPIC:samaajSevaCacheTopic}
redis.timeout=${SAMAAJ_SEVA_SPRING_REDIS_TIMEOUT:500}
redis.pool.size=${SAMAAJ_SEVA_SPRING_REDIS_POOL_SIZE:100}
spring.data.redis.repositories.enabled=false
redis.currentLevelCacheTtl=${SAMAAJ_SEVA_REDIS_CURRENT_LEVEL_CACHE_TTL:1d}
redis.completionPercentageCacheTtl=${SAMAAJ_SEVA_REDIS_COMPLETION_PERCENTAGE_CACHE_TTL:1d}

# ----------------------------------
# ---- Actuator config  ----
# ----------------------------------
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=
management.endpoints.web.path-mapping.health=/actuator/health-check
management.endpoints.web.path-mapping.metrics=/${SAMAAJ_SEVA_ENDPOINTS_METRICS:metrics-json}
management.endpoints.web.path-mapping.prometheus=/${SAMAAJ_SEVA_ENDPOINTS_PROMETHEUS:metrics}

# ----------------------------------
# ---- Kafka config  ----
# ----------------------------------
kafka.bootstrapServers=${SAMAAJ_SEVA_KAFKA_BOOTSTRAP_ADDRESS:localhost:9092}
kafka.producer.connections.max.idle.mins=${SAMAAJ_SEVA_KAFKA_PRODUCER_MAX_IDLE_MINS:10}
kafka.producer.delivery.timeout.ms=${SAMAAJ_SEVA_KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:30000}
kafka.societyMembershipPurchase.topic=${SAMAAJ_SEVA_KAFKA_SOCIETY_MEMBERSHIP_PURCHASE_TOPIC:frontrow_society_membership_purchase}
kafka.eventNotification.topic=${CONTENT_SERVICE_KAFKA_EVENT_NOTIFICATION_TOPIC:frontrow_event_notification}
kafka.society.membership.purchase.event.consumer.groupId=${SAMAAJ_SEVA_KAFKA_SOCIETY_MEMBERSHIP_PURCHASE_EVENT_CONSUMER_GROUP_ID:frontrow_enrolmet_consumer_group}
kafka.society.membership.purchase.event.consumer.connectionsMaxIdleMins=${SAMAAJ_SEVA_KAFKA_SOCIETY_MEMBERSHIP_PURCHASE_EVENT_CONSUMER_CONSUMER_MAX_IDLE:10m}
kafka.society.membership.purchase.event.consumer.maxRetries=${SAMAAJ_SEVA_KAFKA_SOCIETY_MEMBERSHIP_PURCHASE_EVENT_CONSUMER_CONSUMER_MAX_RETRIES:3}
kafka.society.membership.purchase.event.consumer.concurrency=${SAMAAJ_SEVA_KAFKA_SOCIETY_MEMBERSHIP_PURCHASE_EVENT_CONSUMER_CONSUMER_CONCURRENCY:1}
kafka.society.membership.purchase.event.consumer.retryConcurrency=${SAMAAJ_SEVA_KAFKA_SOCIETY_MEMBERSHIP_PURCHASE_EVENT_CONSUMER_CONSUMER_RETRY_CONCURRENCY:1}
kafka.society.membership.purchase.event.consumer.backoffInterval=${SAMAAJ_SEVA_KAFKA_SOCIETY_MEMBERSHIP_PURCHASE_EVENT_CONSUMER_CONSUMER_INITIAL_BACKOFF_INTERVAL:10s}
kafka.society.membership.purchase.event.consumer.allowAutoCreateTopics=${SAMAAJ_SEVA_KAFKA_SOCIETY_MEMBERSHIP_PURCHASE_EVENT_CONSUMER_ALLOW_AUTO_CREATE_TOPICS:true}
kafka.producer.connectionsMaxIdle=${SAMAAJ_SERVICE_KAFKA_PRODUCER_MAX_IDLE:10m}
kafka.producer.retries=${SAMAAJ_SERVICE_KAFKA_PRODUCER_RETRIES:3}
kafka.producer.deliveryTimeout=${SAMAAJ_SERVICE_KAFKA_PRODUCER_DELIVERY_TIMEOUT:30000ms}
kafka.producer.acks=${SAMAAJ_SERVICE_KAFKA_PRODUCER_ACKS:all}


# ----------------------------------
# -------- Threadpool config ------
# ----------------------------------
generic.asyncExecutor.corePoolSize=${SAMAAJ_SEVA_GENERIC_EXCECUTOR_COREPOOL_SIZE:15}
generic.asyncExecutor.maxPoolSize=${SAMAAJ_SEVA_GENERIC_EXCECUTOR_MAXPOOL_SIZE:15}
generic.asyncExecutor.queueSize=${SAMAAJ_SEVA_GENERIC_EXCECUTOR_QUEUE_SIZE:100}
generic.asyncExecutor.threadPriority=${SAMAAJ_SEVA_GENERIC_EXCECUTOR_THREAD_PRIORITY:5}

scheduler.asyncExecutor.corePoolSize=${CONTENT_SERVICE_SCHEDULER_ASYNC_EXCECUTOR_COREPOOL_SIZE:10}
scheduler.asyncExecutor.maxPoolSize=${CONTENT_SERVICE_SCHEDULER_ASYNC_EXCECUTOR_MAXPOOL_SIZE:10}

# ----------------------------------
# ---- Caffeine config  ----
# ----------------------------------
current.level.caffeine.expiry=${SAMAAJ_SEVA_CURRENT_LEVEL_CAFFEINE_EXPIRY:10m}
current.level.caffeine.initialCapacity=${SAMAAJ_SEVA_CURRENT_LEVEL_CAFFEINE_INITIAL_SIZE:100}
current.level.caffeine.maxSize=${SAMAAJ_SEVA_CURRENT_LEVEL_CAFFEINE_MAX_SIZE:5000}

completion.percentage.caffeine.expiry=${SAMAAJ_SEVA_COMPLETION_PERCENTAGE_CAFFEINE_EXPIRY:10m}
completion.percentage.caffeine.initialCapacity=${SAMAAJ_SEVA_COMPLETION_PERCENTAGE_CAFFEINE_INITIAL_SIZE:100}
completion.percentage.caffeine.maxSize=${SAMAAJ_SEVA_COMPLETION_PERCENTAGE_CAFFEINE_MAX_SIZE:5000}

# ----------------------------------
# ---- Other Config  ----
# ----------------------------------
misc.populateSessionsForMonths=${SAMAAJ_SEVA_MISC_POPULATE_SESSIONS_FOR_MONTHS:1}
misc.compensatoryClassesPerMonth=${SAMAAJ_SEVA_MISC_COMPENSATORY_CLASSES_PER_MONTH:2}
misc.bufferDaysCount=${SAMAAJ_SEVA_MISC_BUFFER_DAYS_COUNT:10}

# ----------------------------------
# ---- Event Config  ----
# ----------------------------------
event.notification.societyUserOnboardingEventName=${SAMAAJ_SEVA_EVENT_NOTIFICATION_SOCIETY_USER_ONBOARDING_EVENT_NAME:SOCIETY_USER_ONBOARDING}
event.notification.frontrowSessionCancellationEventName=${SAMAAJ_SEVA_EVENT_NOTIFICATION_FRONTROW_SESSION_CANCELLATION_EVENT_NAME:SOCIETY_SESSION_CANCELLATION}
event.notification.batchKidEnrolmentSingleScheduleEventName=${SAMAAJ_SEVA_EVENT_NOTIFICATION_BATCH_KID_ENROLMENT_SINGLE_SCHEDULE_EVENT_NAME:SOCIETY_BATCH_KID_ENROLMENT_SINGLE_SCHEDULE}
event.notification.batchKidEnrolmentTwoSchedulesEventName=${SAMAAJ_SEVA_EVENT_NOTIFICATION_BATCH_KID_ENROLMENT_TWO_SCHEDULES_EVENT_NAME:SOCIETY_BATCH_KID_ENROLMENT_TWO_SCHEDULES}
event.notification.instructorDelayEventName=${SAMAAJ_SEVA_EVENT_NOTIFICATION_INSTRUCTOR_DELAY_EVENT_NAME:SOCIETY_INSTRUCTOR_DELAY}
event.notification.holidaySessionCancellationEventName=${SAMAAJ_SEVA_EVENT_NOTIFICATION_HOLIDAY_SESSION_CANCELLATION_EVENT_NAME:HOLIDAY_SESSION_CANCELLATION}
